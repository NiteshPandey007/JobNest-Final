version: "1"
services:
- type: web
  name: JobNest-Final backend
  runtime: node
  repo: https://github.com/NiteshPandey007/JobNest-Final
  plan: free
  envVars:
  - key: JWT_SECRET
    sync: false
  - key: MONGO_URI
    sync: false
  region: singapore
  buildCommand: npm install
  startCommand: node server.js
  autoDeployTrigger: commit
  rootDir: backend
